language: python
os: windows
python:
 - "3.11"
 - "3.12"
 - "3.13"
install:
 - pip install -r requirements.txt
 - pip install codecov
 - pip install pytest-cov
 - pip install .
script: 
 - pytest --cov-report=xml --cov=pandasnet tests/

after_success:
 - codecov -t $CODECOV_TOKEN

deploy:
  - provider: pypi
    user: __token__
    password: $FDIEULLE_PYPI_TOKEN
    distributions: "sdist bdist_wheel"
    skip_existing: true
    on:
      tags: true
      python: "3.11"
  - provider: release
    api_key: $GITHUB_TOKEN
    on:
      tags: true
      python: "3.11"

